<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NetShield — 대시보드</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-em: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text-2: #5f5e5a;
    --text-3: #9a9990;
    --radius-md: 8px;
    --radius-lg: 12px;
    --blue: #185FA5;
    --red: #A32D2D;
    --red-bg: #FCEBEB;
    --red-border: #F7C1C1;
    --red-text: #791F1F;
    --amber: #854F0B;
    --amber-bg: #FAEEDA;
    --amber-border: #FAC775;
    --amber-text: #633806;
    --green: #3B6D11;
    --green-bg: #EAF3DE;
    --green-border: #C0DD97;
    --green-text: #27500A;
    --mono: 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #242422;
      --border: rgba(255,255,255,0.1);
      --border-em: rgba(255,255,255,0.18);
      --text: #f0ede8;
      --text-2: #a8a59e;
      --text-3: #6b6860;
    }
  }

  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }

  .container { max-width: 820px; margin: 0 auto; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 36px; height: 36px; background: var(--blue); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 20px; height: 20px; }
  .logo-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .logo-sub { font-size: 12px; color: var(--text-2); margin-top: 1px; }
  .live-badge { font-size: 12px; color: var(--green); background: var(--green-bg); padding: 5px 14px; border-radius: 99px; border: 0.5px solid var(--green-border); }

  .search-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .search-row { display: flex; gap: 8px; }
  .url-input { flex: 1; padding: 9px 14px; font-size: 13px; font-family: var(--mono); background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-md); color: var(--text); outline: none; transition: border-color 0.15s; }
  .url-input:focus { border-color: var(--blue); }
  .analyze-btn { padding: 9px 20px; font-size: 13px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
  .analyze-btn:hover { opacity: 0.88; }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .analyzing { display: none; align-items: center; gap: 10px; padding: 1rem 0 0; color: var(--text-2); font-size: 13px; }
  .analyzing.show { display: flex; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-card { display: none; margin-top: 1rem; border-radius: var(--radius-md); padding: 1rem 1.25rem; }
  .result-card.show { display: block; }
  .result-card.danger { background: var(--red-bg); border: 0.5px solid var(--red-border); }
  .result-card.warning { background: var(--amber-bg); border: 0.5px solid var(--amber-border); }
  .result-card.safe { background: var(--green-bg); border: 0.5px solid var(--green-border); }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .result-title { font-size: 14px; font-weight: 600; }
  .result-title.danger { color: var(--red); }
  .result-title.warning { color: var(--amber); }
  .result-title.safe { color: var(--green); }
  .result-score { font-size: 26px; font-weight: 600; }
  .result-score.danger { color: var(--red); }
  .result-score.warning { color: var(--amber); }
  .result-score.safe { color: var(--green); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; }
  .tag.danger { background: var(--red-border); color: var(--red-text); }
  .tag.warning { background: var(--amber-border); color: var(--amber-text); }
  .tag.safe { background: var(--green-border); color: var(--green-text); }

  .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 1rem; }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 1rem; }
  .stat-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 600; color: var(--text); }
  .stat-value.red { color: var(--red); }
  .stat-value.green { color: var(--green); }

  .log-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }
  .log-head { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 1rem; }
  .log-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
  .log-row:last-child { border-bottom: none; padding-bottom: 0; }
  .vbadge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; min-width: 44px; text-align: center; white-space: nowrap; }
  .vbadge.block { background: var(--red-border); color: var(--red-text); }
  .vbadge.alert { background: var(--amber-border); color: var(--amber-text); }
  .vbadge.allow { background: var(--green-border); color: var(--green-text); }
  .log-url { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-bg { width: 52px; height: 5px; background: var(--border); border-radius: 3px; }
  .bar-fill { height: 5px; border-radius: 3px; }
  .score-num { font-size: 12px; font-weight: 500; min-width: 24px; text-align: right; }
  .score-num.red { color: var(--red); }
  .score-num.amber { color: var(--amber); }
  .score-num.green { color: var(--green); }
  .empty-log { text-align: center; padding: 2rem; font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 2L3 6v5c0 4.1 2.9 7.9 7 9 4.1-1.1 7-4.9 7-9V6L10 2z" fill="white"/></svg>
      </div>
      <div>
        <div class="logo-title">NetShield</div>
        <div class="logo-sub">지능형 유해 URL 탐지 시스템</div>
      </div>
    </div>
    <span class="live-badge">● 실시간 탐지 중</span>
  </div>

  <div class="search-card">
    <div class="search-row">
      <input class="url-input" id="urlInput" type="text" placeholder="https://example.com 입력 후 분석" />
      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">분석 ↗</button>
    </div>
    <div class="analyzing" id="analyzing">
      <div class="spinner"></div>
      <span>URL 분석 중...</span>
    </div>
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <span class="result-title" id="rTitle"></span>
        <span class="result-score" id="rScore"></span>
      </div>
      <div class="tags" id="rTags"></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat"><div class="stat-label">오늘 검사</div><div class="stat-value" id="sTotal">0</div></div>
    <div class="stat"><div class="stat-label">차단됨</div><div class="stat-value red" id="sBlocked">0</div></div>
    <div class="stat"><div class="stat-label">탐지율</div><div class="stat-value" id="sRate">—</div></div>
    <div class="stat"><div class="stat-label">평균 응답</div><div class="stat-value green">12ms</div></div>
  </div>

  <div class="log-card">
    <div class="log-head">최근 탐지 로그</div>
    <div id="logList"><div class="empty-log">URL을 입력하면 로그가 쌓여요</div></div>
  </div>

</div>
<script>
const API = "http://localhost:8000";
let logs = [], total = 0, blocked = 0;

const DEMO = {
  safe: {score:3, verdict:"allow", reasons:[]},
  warn: {score:52, verdict:"alert", reasons:["HTTP 비암호화","최근 등록 도메인"]},
  danger: {score:94, verdict:"block", reasons:["피싱 키워드 포함","고위험 TLD 도메인","HTTP 비암호화","타이포스쿼팅 탐지"]},
  ip: {score:76, verdict:"block", reasons:["IP 주소 직접 사용","HTTP 비암호화"]},
};

function classify(url) {
  const u = url.toLowerCase();
  if (/\d{1,3}\.\d{1,3}\.\d{1,3}/.test(u)) return {...DEMO.ip};
  if (u.includes("paypa")||u.includes(".tk")||u.includes(".xyz")||u.includes("verify")||u.includes("free-gift")||u.includes("secure-")) return {...DEMO.danger};
  if (!u.startsWith("https")) return {...DEMO.warn};
  return {...DEMO.safe};
}

async function analyze() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;
  document.getElementById("resultCard").className = "result-card";
  document.getElementById("analyzing").classList.add("show");
  document.getElementById("analyzeBtn").disabled = true;

  let result;
  try {
    const r = await fetch(`${API}/predict`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url}), signal:AbortSignal.timeout(3000)});
    if (r.ok) {
      const d = await r.json();
      const score = Math.round(d.probability * 100);
      result = {score, verdict: d.is_malicious ? (score>=80?"block":"alert") : "allow",
        reasons: Object.entries(d.features||{}).filter(([k,v])=>v>0&&["has_phishing_keyword","has_typosquatting","has_brand_keyword","has_ip_address"].includes(k)).map(([k])=>({has_phishing_keyword:"피싱 키워드 포함",has_typosquatting:"타이포스쿼팅 탐지",has_brand_keyword:"브랜드 사칭 의심",has_ip_address:"IP 주소 직접 사용"}[k]))};
    } else result = classify(url);
  } catch { result = classify(url); }

  await new Promise(r => setTimeout(r, 300));
  document.getElementById("analyzing").classList.remove("show");
  document.getElementById("analyzeBtn").disabled = false;

  const cls = result.verdict==="block"?"danger":result.verdict==="alert"?"warning":"safe";
  const card = document.getElementById("resultCard");
  card.className = `result-card show ${cls}`;
  const t = document.getElementById("rTitle");
  t.className = `result-title ${cls}`;
  t.textContent = cls==="danger"?"위험 탐지됨":cls==="warning"?"주의 필요":"안전한 URL";
  const s = document.getElementById("rScore");
  s.className = `result-score ${cls}`;
  s.textContent = result.score + " / 100";
  document.getElementById("rTags").innerHTML = result.reasons.length
    ? result.reasons.map(r=>`<span class="tag ${cls}">${r}</span>`).join("")
    : `<span class="tag ${cls}">위협 없음</span>`;

  addLog(url, result);
  total++;
  if (result.verdict==="block") blocked++;
  document.getElementById("sTotal").textContent = total;
  document.getElementById("sBlocked").textContent = blocked;
  document.getElementById("sRate").textContent = Math.round(blocked/total*100)+"%";
}

function addLog(url, r) {
  logs.unshift({url, ...r});
  if (logs.length > 7) logs.pop();
  const barColor = r.verdict==="block"?"#E24B4A":r.verdict==="alert"?"#EF9F27":"#639922";
  const numCls = r.verdict==="block"?"red":r.verdict==="alert"?"amber":"green";
  const label = r.verdict==="block"?"차단":r.verdict==="alert"?"경고":"허용";
  document.getElementById("logList").innerHTML = logs.map(l => {
    const bc = l.verdict==="block"?"#E24B4A":l.verdict==="alert"?"#EF9F27":"#639922";
    const nc = l.verdict==="block"?"red":l.verdict==="alert"?"amber":"green";
    const lb = l.verdict==="block"?"차단":l.verdict==="alert"?"경고":"허용";
    return `<div class="log-row">
      <span class="vbadge ${l.verdict}">${lb}</span>
      <span class="log-url">${l.url}</span>
      <div class="score-wrap">
        <div class="bar-bg"><div class="bar-fill" style="width:${l.score}%;background:${bc}"></div></div>
        <span class="score-num ${nc}">${l.score}</span>
      </div>
    </div>`;
  }).join("");
}

document.getElementById("urlInput").addEventListener("keydown", e => { if(e.key==="Enter") analyze(); });
</script>
</body>
</html>
